<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5 Atar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .screen { display: none; position: fixed; inset: 0; }
  .screen.active { display: block; }

  /* ---------- Menu ---------- */
  #menu {
    background: #f4f5f7;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 16px;
  }
  #menu.active { display: flex; }
  .menu-btn {
    width: min(320px, 100%);
    padding: 22px 0;
    border: none;
    border-radius: 18px;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,.15);
    transition: transform .1s;
  }
  .menu-btn:active { transform: scale(.97); }
  .green { background: #22a447; }
  .red { background: #d42a2a; }

  /* ---------- Main screen (built on a 1026 x 2000 design grid) ---------- */
  #main { background: #fff; overflow-y: auto; }
  .frame {
    container-type: inline-size;
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    min-height: 100%;
    aspect-ratio: 1026 / 2000;
  }
  .header { position: absolute; top: 0; left: 0; width: 100%; display: block; }
  .box {
    position: absolute;
    background: #edf0f4;
    border: 1px solid #e2e5ea;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #333;
    font-size: calc(36 / 1026 * 100cqw);
    overflow: hidden;
    padding: 0 calc(30 / 1026 * 100cqw);
  }
  .box1 {
    left: calc(262 / 1026 * 100cqw);
    top: calc(868 / 1026 * 100cqw);
    width: calc(503 / 1026 * 100cqw);
    height: calc(122 / 1026 * 100cqw);
    border-radius: calc(40 / 1026 * 100cqw);
  }
  .box2 {
    left: calc(82 / 1026 * 100cqw);
    top: calc(1100 / 1026 * 100cqw);
    width: calc(863 / 1026 * 100cqw);
    height: calc(180 / 1026 * 100cqw);
    border-radius: calc(40 / 1026 * 100cqw);
  }
  .clock {
    position: absolute;
    left: 0; width: 100%;
    top: calc(1018 / 1026 * 100cqw);
    text-align: center;
    color: #a3a3a3;
    font-size: calc(37 / 1026 * 100cqw);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.3px;
  }

  /* ---------- Edit screen ---------- */
  #edit { background: #f4f5f7; padding: 24px 16px; overflow-y: auto; }
  #edit h1 { font-size: 26px; margin-bottom: 20px; color: #222; }
  #edit label { display: block; font-weight: 600; color: #444; margin: 16px 0 6px; }
  #edit input {
    width: 100%; padding: 14px; font-size: 17px;
    border: 1px solid #ccd; border-radius: 12px; background: #fff;
  }
  .row { display: flex; gap: 12px; margin-top: 28px; }
  .row button {
    flex: 1; padding: 14px; font-size: 18px; font-weight: 600;
    border: none; border-radius: 12px; color: #fff; cursor: pointer;
  }
  .grey { background: #888; }
</style>
</head>
<body>

<!-- Menu -->
<div id="menu" class="screen active">
  <button class="menu-btn green" id="startBtn">START</button>
  <button class="menu-btn red" id="editBtn">EDIT</button>
</div>

<!-- Main screen -->
<div id="main" class="screen">
  <div class="frame">
    <svg class="header" viewBox="0 0 1026 600" aria-hidden="true">
      <path fill="#ae2024" d="M0,0 H1026 V558 a40,40 0 0 1 -40,40 H782 a40,40 0 0 1 -40,-40 V550 A228.5,228.5 0 0 0 285,550 V558 a40,40 0 0 1 -40,40 H40 a40,40 0 0 1 -40,-40 Z"/>
    </svg>
    <div class="box box1" id="box1Text"></div>
    <div class="clock" id="clock"></div>
    <div class="box box2" id="box2Text"></div>
  </div>
</div>

<!-- Edit screen -->
<div id="edit" class="screen">
  <h1>Edit</h1>
  <label for="in1">Top box text</label>
  <input id="in1" placeholder="Leave empty for a blank box">
  <label for="in2">Bottom box text</label>
  <input id="in2" placeholder="Leave empty for a blank box">
  <div class="row">
    <button class="grey" id="cancelBtn">Back</button>
    <button class="green" id="saveBtn">Save</button>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  function load(key) {
    try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }

  // Simple hash routing so the phone's back button/gesture returns to the menu
  function show() {
    const name = location.hash.slice(1) || "menu";
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === name));
    if (name === "main") {
      $("box1Text").textContent = load("box1");
      $("box2Text").textContent = load("box2");
    }
    if (name === "edit") {
      $("in1").value = load("box1");
      $("in2").value = load("box2");
    }
  }
  window.addEventListener("hashchange", show);
  show();

  $("startBtn").onclick = () => location.hash = "main";
  $("editBtn").onclick = () => location.hash = "edit";
  $("cancelBtn").onclick = () => location.hash = "";
  $("saveBtn").onclick = () => {
    save("box1", $("in1").value);
    save("box2", $("in2").value);
    location.hash = "";
  };

  // Live clock, e.g. "11:06:40 AM"
  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString("en-US", {
      hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true
    });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
