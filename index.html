<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5 Atar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .screen { display: none; position: fixed; inset: 0; }
  .screen.active { display: block; }

  /* ---------- Menu ---------- */
  #menu {
    background: #f4f5f7;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 16px;
  }
  #menu.active { display: flex; }
  .menu-btn {
    width: min(320px, 100%);
    padding: 22px 0;
    border: none;
    border-radius: 18px;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,.15);
    transition: transform .1s;
  }
  .menu-btn:active { transform: scale(.97); }
  .green { background: #22a447; }
  .red { background: #d42a2a; }

  /* ---------- Main screen (built on a 1026 x 2000 design grid) ---------- */
  #main { background: #fff; overflow-y: auto; }
  .frame {
    container-type: inline-size;
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    min-height: 100%;
    aspect-ratio: 1026 / 2000;
    overflow: hidden;
  }
  .header { position: absolute; top: 0; left: 0; width: 100%; display: block; }
  .box {
    position: absolute;
    background: #edf0f4;
    border: 1px solid #e2e5ea;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #333;
    font-size: calc(36 / 1026 * 100cqw);
    overflow: hidden;
    padding: 0 calc(30 / 1026 * 100cqw);
  }
  .box1 {
    left: calc(262 / 1026 * 100cqw);
    top: calc(868 / 1026 * 100cqw);
    width: calc(503 / 1026 * 100cqw);
    height: calc(122 / 1026 * 100cqw);
    border-radius: calc(40 / 1026 * 100cqw);
  }
  .box2 {
    left: calc(82 / 1026 * 100cqw);
    top: calc(1100 / 1026 * 100cqw);
    width: calc(863 / 1026 * 100cqw);
    height: calc(180 / 1026 * 100cqw);
    border-radius: calc(40 / 1026 * 100cqw);
  }
  .clock {
    position: absolute;
    left: 0; width: 100%;
    top: calc(1018 / 1026 * 100cqw);
    text-align: center;
    color: #a3a3a3;
    font-size: calc(37 / 1026 * 100cqw);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.3px;
  }

  /* ---------- Placed photos ---------- */
  .photo {
    position: absolute;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .photo img { display: block; width: 100%; height: 100%; pointer-events: none; }
  .handle { display: none; }

  /* ---------- Edit mode ---------- */
  #main.editing .frame { margin-bottom: 90px; }
  #main.editing .photo { touch-action: none; cursor: move; outline: 1px dashed rgba(0,0,0,.35); }
  #main.editing .photo.selected { outline: 3px solid #1e88ff; z-index: 1000 !important; }
  #main.editing .photo.selected .handle {
    display: block;
    position: absolute;
    right: -16px; bottom: -16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #1e88ff;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    touch-action: none;
    cursor: nwse-resize;
  }
  #main.editing .box { cursor: text; outline: 2px dashed #1e88ff; }
  .toolbar {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    gap: 8px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.95);
    border-top: 1px solid #ddd;
    z-index: 2000;
  }
  #main.editing .toolbar { display: flex; }
  .toolbar button, .toolbar label {
    flex: 1;
    padding: 14px 4px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
  }
  .toolbar button:disabled { opacity: .35; }
  .blue { background: #1e88ff; }
  .grey { background: #777; }
  .hint {
    display: none;
    position: fixed;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.75);
    color: #fff;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 20px;
    z-index: 2000;
    width: max-content;
    max-width: calc(100% - 32px);
    text-align: center;
    pointer-events: none;
  }
  #main.editing .hint { display: block; }
</style>
</head>
<body>

<!-- Menu -->
<div id="menu" class="screen active">
  <button class="menu-btn green" id="startBtn">START</button>
  <button class="menu-btn red" id="editBtn">EDIT</button>
</div>

<!-- Main screen (also used for editing) -->
<div id="main" class="screen">
  <div class="frame" id="frame">
    <svg class="header" viewBox="0 0 1026 600" aria-hidden="true">
      <path fill="#ae2024" d="M0,0 H1026 V558 a40,40 0 0 1 -40,40 H782 a40,40 0 0 1 -40,-40 V550 A228.5,228.5 0 0 0 285,550 V558 a40,40 0 0 1 -40,40 H40 a40,40 0 0 1 -40,-40 Z"/>
    </svg>
    <div class="box box1" id="box1Text"></div>
    <div class="clock" id="clock"></div>
    <div class="box box2" id="box2Text"></div>
  </div>

  <div class="hint">Drag to move · blue dot or pinch to resize · tap grey box for text</div>
  <div class="toolbar">
    <label class="blue" for="fileInput">+ Photo</label>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <button class="red" id="deleteBtn" disabled>Delete</button>
    <button class="grey" id="doneBtn">Done</button>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const frame = $("frame");
  const main = $("main");

  /* ---------- Storage (IndexedDB, so photos survive between uses) ---------- */
  const dbReady = new Promise((resolve, reject) => {
    const req = indexedDB.open("five-atar", 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore("photos", { keyPath: "id" });
      req.result.createObjectStore("settings");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  async function tx(store, mode, fn) {
    const db = await dbReady;
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => resolve(r && r.result);
      t.onerror = () => reject(t.error);
    });
  }
  const getAllPhotos = () => tx("photos", "readonly", s => s.getAll());
  const putPhoto = p => tx("photos", "readwrite", s => s.put(p));
  const deletePhoto = id => tx("photos", "readwrite", s => s.delete(id));
  const getSetting = k => tx("settings", "readonly", s => s.get(k));
  const putSetting = (k, v) => tx("settings", "readwrite", s => s.put(v, k));

  /* ---------- Photos on the screen ----------
     Positions are stored as fractions of the screen width, so the layout
     looks the same on any phone size. */
  const photos = new Map(); // id -> { data, el }
  let selected = null;
  let topZ = 1;

  function place(p) {
    const el = p.el;
    el.style.left = (p.data.x * 100) + "cqw";
    el.style.top = (p.data.y * 100) + "cqw";
    el.style.width = (p.data.w * 100) + "cqw";
    el.style.height = (p.data.w * p.data.ratio * 100) + "cqw";
    el.style.zIndex = p.data.z;
  }

  function addToScreen(data) {
    const el = document.createElement("div");
    el.className = "photo";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(data.blob);
    img.draggable = false;
    const handle = document.createElement("div");
    handle.className = "handle";
    el.append(img, handle);
    frame.appendChild(el);
    const p = { data, el };
    photos.set(data.id, p);
    topZ = Math.max(topZ, data.z + 1);
    place(p);
    attachGestures(p, handle);
    return p;
  }

  function select(p) {
    if (selected) selected.el.classList.remove("selected");
    selected = p;
    if (p) p.el.classList.add("selected");
    $("deleteBtn").disabled = !p;
  }

  // Shrink big camera photos so storage stays small and fast
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = reject;
      img.src = url;
    });
  }
  async function shrink(file) {
    const img = await loadImage(file);
    const max = 1400;
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const type = file.type === "image/png" ? "image/png" : "image/jpeg";
    const blob = await new Promise(r => c.toBlob(r, type, 0.88));
    return { blob, ratio: c.height / c.width };
  }

  $("fileInput").addEventListener("change", async e => {
    const files = [...e.target.files];
    e.target.value = "";
    // Drop new photos near the top of what's currently visible
    const visibleTop = main.scrollTop / frame.clientWidth;
    for (const [i, file] of files.entries()) {
      try {
        const { blob, ratio } = await shrink(file);
        const w = 0.5;
        const data = {
          id: Date.now() + "-" + Math.random().toString(36).slice(2),
          blob, ratio, w,
          x: 0.25 + i * 0.04,
          y: visibleTop + 0.15 + i * 0.04,
          z: topZ++
        };
        await putPhoto(data);
        select(addToScreen(data));
      } catch (err) {
        alert("Couldn't add that photo.");
      }
    }
  });

  $("deleteBtn").onclick = async () => {
    if (!selected) return;
    const p = selected;
    select(null);
    p.el.remove();
    URL.revokeObjectURL(p.el.querySelector("img").src);
    photos.delete(p.data.id);
    await deletePhoto(p.data.id);
  };

  /* ---------- Drag, resize handle and pinch ---------- */
  function attachGestures(p, handle) {
    const pointers = new Map();
    let start = null;

    const snapshot = () => {
      const pts = [...pointers.values()];
      const s = { x: p.data.x, y: p.data.y, w: p.data.w, pts: pts.map(q => ({ ...q })) };
      if (pts.length >= 2) {
        s.dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        s.cx = (pts[0].x + pts[1].x) / 2;
        s.cy = (pts[0].y + pts[1].y) / 2;
      }
      return s;
    };

    p.el.addEventListener("pointerdown", e => {
      if (!main.classList.contains("editing")) return;
      e.preventDefault();
      e.stopPropagation();
      if (selected !== p) {
        select(p);
        p.data.z = topZ++;
        place(p);
      }
      p.el.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, resize: e.target === handle });
      start = snapshot();
    });

    p.el.addEventListener("pointermove", e => {
      if (!pointers.has(e.pointerId)) return;
      const cur = pointers.get(e.pointerId);
      cur.x = e.clientX; cur.y = e.clientY;
      const W = frame.clientWidth;
      const pts = [...pointers.values()];

      if (pts.length >= 2 && start.dist) {
        // Pinch: scale around the middle of the two fingers
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
        const w = Math.min(3, Math.max(0.08, start.w * dist / start.dist));
        const k = w / start.w;
        const rect = frame.getBoundingClientRect();
        const ox = (start.cx - rect.left) / W, oy = (start.cy - rect.top) / W;
        p.data.w = w;
        p.data.x = ox - (ox - start.x) * k + (cx - start.cx) / W;
        p.data.y = oy - (oy - start.y) * k + (cy - start.cy) / W;
      } else if (start.pts[0] && start.pts[0].resize) {
        // Corner handle: resize keeping the photo's shape
        const dx = (cur.x - start.pts[0].x) / W;
        const dy = (cur.y - start.pts[0].y) / W / p.data.ratio;
        p.data.w = Math.min(3, Math.max(0.08, start.w + Math.max(dx, dy)));
      } else if (start.pts[0]) {
        p.data.x = start.x + (cur.x - start.pts[0].x) / W;
        p.data.y = start.y + (cur.y - start.pts[0].y) / W;
      }
      place(p);
    });

    const end = e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      start = snapshot();
      if (pointers.size === 0) putPhoto(p.data);
    };
    p.el.addEventListener("pointerup", end);
    p.el.addEventListener("pointercancel", end);
  }

  // Tapping empty space deselects
  frame.addEventListener("pointerdown", e => {
    if (main.classList.contains("editing") && !e.target.closest(".photo")) select(null);
  });

  /* ---------- Box text (tap a grey box while editing) ---------- */
  for (const key of ["box1", "box2"]) {
    $(key + "Text").addEventListener("click", async () => {
      if (!main.classList.contains("editing")) return;
      const current = (await getSetting(key)) || "";
      const val = prompt("Text for this box (leave empty for blank):", current);
      if (val === null) return;
      await putSetting(key, val);
      $(key + "Text").textContent = val;
    });
  }

  /* ---------- Load everything saved ---------- */
  (async () => {
    try {
      const all = await getAllPhotos();
      all.sort((a, b) => a.z - b.z).forEach(addToScreen);
      $("box1Text").textContent = (await getSetting("box1")) || "";
      $("box2Text").textContent = (await getSetting("box2")) || "";
    } catch (err) {
      console.error(err);
    }
  })();

  /* ---------- Screens (hash routing so the phone's back button works) ---------- */
  function show() {
    const name = location.hash.slice(1) || "menu";
    const screen = name === "edit" ? "main" : name;
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === screen));
    main.classList.toggle("editing", name === "edit");
    if (name !== "edit") select(null);
  }
  window.addEventListener("hashchange", show);
  show();

  $("startBtn").onclick = () => location.hash = "main";
  $("editBtn").onclick = () => location.hash = "edit";
  $("doneBtn").onclick = () => location.hash = "";

  /* ---------- Live clock, e.g. "11:06:40 AM" ---------- */
  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString("en-US", {
      hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true
    });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
